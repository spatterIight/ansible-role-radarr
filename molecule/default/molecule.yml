---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: true
driver:
  name: docker
platforms:
  - name: radarr-${MOLECULE_DISTRO:-ubuntu2604}-default
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest"
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  inventory:
    group_vars:
      all:
        # Helper variables
        radarr_debug_service_enabled: false
        radarr_restarts_check_enabled: true

        # The host directory mounted into the container through
        # `radarr_container_additional_volumes`, and the file placed in it by
        # prepare.yml. Reading that file from inside the container is what
        # proves the additional volumes reach the systemd unit rather than
        # being merely declared in defaults/main.yml.
        radarr_molecule_extra_volume_src: /radarr-molecule-extra
        radarr_molecule_extra_volume_dst: /molecule-extra
        radarr_molecule_extra_volume_marker: radarr-molecule-additional-volume-marker

        # Nothing about Radarr's own defaults can produce these. Radarr's
        # built-in port is 7878, it calls itself "Radarr" and it generates a
        # random API key on first start, so every one of them turning up as
        # this file spells it is attributable to the role and to nothing else.
        # See molecule/default/verify.yml.
        radarr_molecule_api_key: a1b2c3d4e5f60718293a4b5c6d7e8f90
        radarr_molecule_instance_name: MoleculeRadarrInstance

        # Variables for Radarr
        #
        # Deliberately not 1000: the linuxserver.io PUID/PGID pattern has left a
        # needed directory unwritable in other roles of this fleet, and a uid
        # that exists in the test image by accident would hide that.
        radarr_uid: 1873
        radarr_gid: 1873

        radarr_hostname: radarr.molecule.local

        # A non-root path prefix exercises the strip-prefix and slashless
        # redirect middlewares in templates/labels.j2.
        radarr_path_prefix: /radarr-ui

        # Neither the role's default of Etc/UTC nor the test host's zone, so
        # that the timezone the container ends up in can only have come from
        # templates/env.j2.
        radarr_environment_variables_tz: Asia/Tokyo

        radarr_container_labels_traefik_enabled: true

        # Bound to the loopback interface of the test container only. Nothing
        # is published to the machine running Molecule, so two scenarios can
        # run side by side without fighting over a port.
        radarr_container_http_host_bind_port: "127.0.0.1:17878"

        radarr_container_http_port: 17878

        radarr_environment_variables_additional_variables: |
          RADARR__AUTH__APIKEY={{ radarr_molecule_api_key }}
          RADARR__APP__INSTANCENAME={{ radarr_molecule_instance_name }}

        radarr_container_additional_volumes:
          - type: bind
            src: "{{ radarr_molecule_extra_volume_src }}"
            dst: "{{ radarr_molecule_extra_volume_dst }}"
            options: readonly
  env:
    # Workaround for https://github.com/ansible/molecule/issues/4391
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..:/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles:~/.ansible/roles
verifier:
  name: ansible

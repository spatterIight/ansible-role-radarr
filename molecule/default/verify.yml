---
- name: Verify Radarr
  hosts: all
  become: true
  gather_facts: false

  vars:
    # These are
    # role defaults, but Jinja-derived ones, and a verify play cannot resolve
    # those out of defaults/main.yml - so they are spelled out here.
    radarr_verify_base_path: /radarr
    radarr_verify_data_path: /radarr/data

    radarr_verify_url: "http://127.0.0.1:17878"
    radarr_verify_api_url: "http://127.0.0.1:17878/api/v3"
    radarr_verify_headers:
      X-Api-Key: "{{ radarr_molecule_api_key }}"

    # The name carries both the role and the scenario, like the platform does,
    # so a leftover container can never be mistaken for another scenario's.
    radarr_verify_control_container: "{{ inventory_hostname }}-stock-control"

    # A path Radarr has no route for. Its single-page app answers 200 on it
    # anyway, which is the whole reason none of the assertions below gate on a
    # status code alone.
    radarr_verify_nonexistent_path: /molecule-no-such-path

    # The tag the round trip creates. Distinctive enough that finding it in
    # Radarr's database cannot be a coincidence.
    radarr_verify_tag_label: molecule-round-trip-tag

    # Nobody ever creates this one. Asking for it proves the read-back is a
    # search that discriminates, rather than a call returning whatever exists.
    radarr_verify_absent_tag_label: molecule-never-created-tag

    # The unusual values the scenario configures the role with. Written down
    # here rather than read back out of the inventory, so that a verify run
    # compares the running container against something stated, not against
    # whatever the scenario happens to say at the time.
    radarr_expected_uid: 1873
    radarr_expected_gid: 1873
    radarr_expected_hostname: radarr.molecule.local
    radarr_expected_path_prefix: /radarr-ui
    radarr_expected_timezone: Asia/Tokyo
    radarr_expected_timezone_abbreviation: JST

    radarr_verify_units:
      - radarr.service

  tasks:
    - name: Verify that Radarr works
      block:
        # The role is not included in this playbook, so its defaults are not in
        # scope. Reading defaults/main.yml directly ties the version assertion
        # below.
        - name: Load the role defaults
          ansible.builtin.include_vars:
            file: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}/defaults/main.yml"
            name: radarr_defaults

        # ------------------------------------------------------------------
        # The negative control, started first so that it boots alongside the
        # assertions below rather than after them
        # ------------------------------------------------------------------

        - name: Inspect Radarr container
          ansible.builtin.command:
            cmd: docker container inspect radarr
          register: radarr_container_raw
          changed_when: false

        - name: Parse the Radarr container definition
          ansible.builtin.set_fact:
            radarr_container: "{{ (radarr_container_raw.stdout | from_json)[0] }}"

        # The same image, with none of the role's configuration. Anything this one
        # can do unaided is worthless as evidence about the role, and it can do more
        # than one would hope: it serves HTTP 200 on `/`, on `/login` and on every
        # path that does not exist, answers `/ping` with `{"status": "OK"}`, and
        # hands its API key to anyone who asks for `/initialize.json`. An HTTP probe
        # that only looks for a 200 therefore proves nothing at all, which is why
        # every assertion below is about a value this container cannot produce.
        - name: Remove any leftover stock Radarr control container
          ansible.builtin.command:
            cmd: "docker rm -f {{ radarr_verify_control_container }}"
          changed_when: false
          failed_when: false

        - name: Run the Radarr image with none of the role's configuration
          ansible.builtin.command:
            cmd: >-
              docker run -d --rm
              --name {{ radarr_verify_control_container }}
              {{ radarr_container.Config.Image }}
          changed_when: true

        # ------------------------------------------------------------------
        # The systemd unit
        # ------------------------------------------------------------------

        - name: Wait for the Radarr systemd services to become active (up to 180s each)
          ansible.builtin.systemd_service:
            name: "{{ item }}"
          register: radarr_services
          until: radarr_services.status.ActiveState == 'active'
          retries: 36
          delay: 5
          loop: "{{ radarr_verify_units }}"
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `Restart=always` in the systemd unit means that even a container which crashes
        # and gets restarted reads as active here, so this is a precondition rather than
        # a result.
        - name: Assert the Radarr systemd services are active
          ansible.builtin.assert:
            that: radarr_services.results | map(attribute='status.ActiveState') | unique | list == ['active']
            fail_msg: >-
              Not every service is active:
              {{ dict(radarr_verify_units | zip(radarr_services.results | map(attribute='status.ActiveState'))) }}
            success_msg: "Every systemd service is active"

        - name: Retrieve the Radarr systemd services log for debugging
          when: radarr_debug_service_enabled | bool
          ansible.builtin.command:
            cmd: "journalctl --no-pager --output=cat --unit={{ item }}"
          changed_when: false
          loop: "{{ radarr_verify_units }}"

        # A published Docker port with nothing listening behind it resets the
        # connection rather than refusing it, which `uri` reports as status -1, and
        # Radarr needs a while to migrate its database before it serves anything.
        # The loop has to survive both, so failures are tolerated here and judged
        # after.
        - name: Wait for Radarr to report itself healthy (up to 180s)
          ansible.builtin.uri:
            url: "{{ radarr_verify_url }}/ping"
            method: GET
            follow_redirects: none
          register: radarr_health
          until: radarr_health.status == 200 and (radarr_health.json | default({})).get('status', '') == 'OK'
          retries: 36
          delay: 5
          # So that giving up is reported by the assertion below rather than as a
          # wall of systemd unit properties.
          failed_when: false

        # `/ping` is Radarr's own health check and it opens the SQLite database to
        # answer, so unlike the single-page app it cannot answer while Radarr is
        # broken.
        - name: Assert Radarr reports itself healthy
          ansible.builtin.assert:
            that: (radarr_health.json | default({})).get('status', '') == 'OK'
            fail_msg: "Radarr did not report itself healthy: {{ radarr_health.status | default('no response') }}"
            success_msg: "Radarr reports itself healthy"

        # ------------------------------------------------------------------
        # The bind mounts
        # ------------------------------------------------------------------

        # `radarr_container_additional_volumes` has been declared but never rendered
        # in other roles of this fleet. Reading the file back from inside the
        # container is the difference between the variable existing and it working.
        - name: Read the additional volume from inside the Radarr container
          ansible.builtin.command:
            cmd: >-
              docker exec radarr
              cat {{ radarr_molecule_extra_volume_dst }}/marker.txt
          register: radarr_extra_volume
          changed_when: false
          failed_when: false

        - name: Assert the additional volume is mounted into the Radarr container
          ansible.builtin.assert:
            that:
              - radarr_extra_volume.rc == 0
              - radarr_extra_volume.stdout | trim == radarr_molecule_extra_volume_marker
            fail_msg: >-
              {{ radarr_molecule_extra_volume_dst }}/marker.txt does not hold
              {{ radarr_molecule_extra_volume_marker }}, so radarr_container_additional_volumes
              is declared but not rendered into the systemd unit
            success_msg: >-
              {{ radarr_molecule_extra_volume_src }} is mounted at
              {{ radarr_molecule_extra_volume_dst }} inside the container

        # ------------------------------------------------------------------
        # What `docker create` was actually told
        # ------------------------------------------------------------------

        # Radarr keeps its port in the config.xml it maintains for itself under
        # `radarr_data_path`, which this role does not template. Only the
        # `RADARR__SERVER__PORT` the role renders into the env file can move it, so
        # a Radarr listening anywhere other than 7878 is the role's doing. The
        # absence of 7878 matters as much as the presence of the configured port:
        # were the override dropped, the published port and the Traefik label would
        # still say 17878 while the process sat on 7878.
        - name: Read the ports Radarr listens on
          ansible.builtin.command:
            cmd: docker exec radarr netstat -lnt
          register: radarr_listening_raw
          changed_when: false

        - name: Make sense of the ports Radarr listens on
          ansible.builtin.set_fact:
            radarr_listening_ports: "{{ radarr_listening_raw.stdout | regex_findall(':([0-9]+)\\s') | unique }}"

        - name: Assert Radarr listens on the port the role configured and not on its own default
          ansible.builtin.assert:
            that:
              - radarr_container_http_port | string in radarr_listening_ports
              - "'7878' not in radarr_listening_ports"
            fail_msg: >-
              Radarr listens on {{ radarr_listening_ports | join(', ') }}, not on the configured
              17878, so radarr_container_http_port does not reach the process
            success_msg: >-
              Radarr listens on 17878 and not on its built-in 7878,
              so radarr_container_http_port reaches the process

        - name: Assert that the role's uid and gid reached the container
          ansible.builtin.assert:
            that:
              - radarr_container.Config.User == (radarr_expected_uid | string) ~ ':' ~ (radarr_expected_gid | string)
              - ('PUID=' ~ radarr_expected_uid) in radarr_container.Config.Env
              - ('PGID=' ~ radarr_expected_gid) in radarr_container.Config.Env
            fail_msg: >-
              The container runs as {{ radarr_container.Config.User }}
              with {{ radarr_container.Config.Env | select('match', 'P[UG]ID=') | list }}
            success_msg: "The container runs as {{ radarr_container.Config.User }} and carries the matching PUID/PGID"

        - name: Assert that the role's timezone reached the container environment
          ansible.builtin.assert:
            that:
              - ('TZ=' ~ radarr_expected_timezone) in radarr_container.Config.Env
            fail_msg: "templates/env.j2 did not put TZ={{ radarr_expected_timezone }} on the container"
            success_msg: "The container environment carries TZ={{ radarr_expected_timezone }}"

        - name: Assert that the container image is the pinned version
          ansible.builtin.assert:
            that:
              - radarr_container.Config.Image == 'ghcr.io/linuxserver/radarr:' ~ radarr_defaults.radarr_version
            fail_msg: >-
              The container runs {{ radarr_container.Config.Image }}, not the
              {{ radarr_defaults.radarr_version }} pinned in defaults/main.yml
            success_msg: "The container runs {{ radarr_container.Config.Image }}"

        # linuxserver.io stamps its own build onto the image as
        # `<Radarr version>-ls<rebuild counter>`.
        #
        # `radarr_version` pins a three-component linuxserver.io tag (`6.3.0`) while
        # Radarr's own version has four components (`6.3.0.10514`) and the image
        # label carries the rebuild counter on top (`6.3.0.10514-ls314`), so the pin
        # is compared as a prefix - with the trailing dot,
        - name: Assert the running Radarr is the version this role installs
          ansible.builtin.assert:
            that: radarr_container.Config.Labels['org.opencontainers.image.version'].startswith(radarr_defaults.radarr_version)
            fail_msg: "Radarr reports {{ radarr_container.Config.Labels['org.opencontainers.image.version'] | default('none') }}, expected {{ radarr_defaults.radarr_version }}"
            success_msg: "Radarr reports {{ radarr_container.Config.Labels['org.opencontainers.image.version'] }}"

        # ------------------------------------------------------------------
        # Traefik labels
        # ------------------------------------------------------------------

        - name: Assert that the Traefik labels describe the configured hostname and path prefix
          ansible.builtin.assert:
            that:
              - radarr_container.Config.Labels['traefik.enable'] == 'true'
              - radarr_container.Config.Labels['traefik.http.routers.radarr.rule'] == 'Host(`' ~ radarr_expected_hostname ~ '`) && PathPrefix(`' ~ radarr_expected_path_prefix ~ '`)'
              - radarr_container.Config.Labels['traefik.http.middlewares.radarr-strip-prefix.stripprefix.prefixes'] == radarr_expected_path_prefix
              - radarr_container.Config.Labels['traefik.http.services.radarr.loadbalancer.server.port'] == '17878'
            fail_msg: "The Traefik labels are not what templates/labels.j2 should have produced: {{ radarr_container.Config.Labels }}"
            success_msg: "The Traefik labels route {{ radarr_expected_hostname }}{{ radarr_expected_path_prefix }} to port 17878"

        # ------------------------------------------------------------------
        # What the process inside the container actually sees
        # ------------------------------------------------------------------

        - name: Ask the Radarr container which timezone and user it is running in
          ansible.builtin.command:
            cmd: docker exec radarr sh -c 'date +%Z; id -u; id -g'
          register: radarr_process_identity
          changed_when: false

        - name: Assert that the Radarr process runs in the role's timezone, as the role's user
          ansible.builtin.assert:
            that:
              - radarr_process_identity.stdout_lines[0] == radarr_expected_timezone_abbreviation
              - radarr_process_identity.stdout_lines[1] == radarr_expected_uid | string
              - radarr_process_identity.stdout_lines[2] == radarr_expected_gid | string
            fail_msg: >-
              The container reports zone/uid/gid {{ radarr_process_identity.stdout_lines }},
              expected [{{ radarr_expected_timezone_abbreviation }},
              {{ radarr_expected_uid }}, {{ radarr_expected_gid }}]
            success_msg: >-
              The Radarr process runs in {{ radarr_process_identity.stdout_lines[0] }}
              as {{ radarr_process_identity.stdout_lines[1] }}:{{ radarr_process_identity.stdout_lines[2] }}

        # ------------------------------------------------------------------
        # Verify environment variables reach Radarr
        # ------------------------------------------------------------------

        - name: Read the Radarr system status
          ansible.builtin.uri:
            url: "{{ radarr_verify_api_url }}/system/status"
            method: GET
            headers: "{{ radarr_verify_headers }}"
            follow_redirects: none
          register: radarr_status
          changed_when: false

        # The API key and the instance name both come from
        # `radarr_environment_variables_additional_variables`. Radarr generates a
        # random API key on first start and calls itself "Radarr", so a status
        # response that answered to the role's key and carries the role's instance
        # name cannot have come from an unconfigured Radarr. `migrationVersion` and
        # `appData` come out of the SQLite database Radarr keeps under the path the
        # role bind-mounts, so this response is not a static page either.
        - name: Assert the additional environment variables reached Radarr
          ansible.builtin.assert:
            that:
              - radarr_status.status == 200
              - radarr_status.json.instanceName == radarr_molecule_instance_name
              - radarr_status.json.databaseType == 'sqLite'
              - radarr_status.json.migrationVersion | int > 0
              - radarr_status.json.appData == '/config'
            fail_msg: >-
              Radarr calls itself {{ radarr_status.json.instanceName | default('none') }} rather than
              {{ radarr_molecule_instance_name }}, so radarr_environment_variables_additional_variables
              does not reach the process
            success_msg: >-
              Radarr answered the role's API key, calls itself {{ radarr_molecule_instance_name }}
              and reports database migration {{ radarr_status.json.migrationVersion }}

        # ------------------------------------------------------------------
        # A round trip through the API and out the other side of the database
        # ------------------------------------------------------------------

        - name: Create a tag through the Radarr API
          ansible.builtin.uri:
            url: "{{ radarr_verify_api_url }}/tag"
            method: POST
            headers: "{{ radarr_verify_headers }}"
            body_format: json
            body:
              label: "{{ radarr_verify_tag_label }}"
            status_code: [201]
            follow_redirects: none
          changed_when: true

        - name: Read the tags back through the Radarr API
          ansible.builtin.uri:
            url: "{{ radarr_verify_api_url }}/tag"
            method: GET
            headers: "{{ radarr_verify_headers }}"
            follow_redirects: none
          register: radarr_tags
          changed_when: false

        - name: Assert the Radarr API returns the tag that was created and nothing else
          ansible.builtin.assert:
            that:
              - radarr_verify_tag_label in radarr_tag_labels
              - radarr_verify_absent_tag_label not in radarr_tag_labels
            fail_msg: "The Radarr API returned {{ radarr_tag_labels | join(', ') }}"
            success_msg: "The Radarr API returned the tag that was created"
          vars:
            radarr_tag_labels: "{{ radarr_tags.json | map(attribute='label') | list }}"

        # The API could be answering out of memory. Radarr keeps its state in a
        # SQLite database in the directory the role bind-mounts, so the row has to
        # be there too, on the host side of the mount.
        - name: Read the tags out of the Radarr database
          ansible.builtin.command:
            argv:
              - python3
              - -c
              - |
                import json, sqlite3, sys
                connection = sqlite3.connect(sys.argv[1])
                print(json.dumps([row[0] for row in connection.execute('SELECT "Label" FROM "Tags"')]))
              - "{{ radarr_verify_data_path }}/radarr.db"
          register: radarr_database_tags
          changed_when: false

        - name: Assert the tag reached the Radarr database under the role's data path
          ansible.builtin.assert:
            that:
              - radarr_verify_tag_label in radarr_database_labels
              - radarr_verify_absent_tag_label not in radarr_database_labels
            fail_msg: "{{ radarr_verify_data_path }}/radarr.db holds {{ radarr_database_labels | join(', ') }}"
            success_msg: >-
              {{ radarr_verify_data_path }}/radarr.db holds the tag the API created,
              so Radarr's state lives where the role put it
          vars:
            radarr_database_labels: "{{ radarr_database_tags.stdout | from_json }}"

        # ------------------------------------------------------------------
        # # The negative control, which was started at the top of this play.
        # ------------------------------------------------------------------

        - name: Wait for the stock Radarr control container to come up
          ansible.builtin.command:
            cmd: >-
              docker exec {{ radarr_verify_control_container }}
              wget --quiet --output-document=- http://127.0.0.1:7878/initialize.json
          register: radarr_control_initialize
          until: radarr_control_initialize.rc == 0
          retries: 60
          delay: 5
          changed_when: false
          failed_when: false

        - name: Ask the stock Radarr control container for a path that does not exist
          ansible.builtin.command:
            cmd: >-
              docker exec {{ radarr_verify_control_container }}
              wget --quiet --output-document=- http://127.0.0.1:7878{{ radarr_verify_nonexistent_path }}
          register: radarr_control_nonexistent
          changed_when: false
          failed_when: false

        - name: Assert the stock Radarr image serves a different instance entirely
          ansible.builtin.assert:
            that:
              # It comes up unaided, so "it responds" is not evidence about the role.
              - radarr_control_initialize.rc == 0
              # And it answers 200 even for a path Radarr has no route for, which is
              # what makes a bare `GET /` worthless as a probe.
              - radarr_control_nonexistent.rc == 0
              # It is a plain, unauthenticated Radarr: it hands out its own API key.
              - radarr_control_json.apiKey | length > 0
              # And that key is not the role's, so the status response above was
              # answered by a Radarr the role configured.
              - radarr_control_json.apiKey != radarr_molecule_api_key
              - radarr_control_json.instanceName == 'Radarr'
            fail_msg: >-
              The stock Radarr image produced {{ radarr_control_initialize.stdout | default('none') }},
              which makes the assertions above unattributable to the role
            success_msg: >-
              The stock Radarr image answers 200 on any path, serves its own random API key
              and calls itself "Radarr", so the configured instance above is the role's doing
          vars:
            radarr_control_json: "{{ radarr_control_initialize.stdout | from_json }}"

        - name: Offer the role's API key to the stock Radarr control container
          ansible.builtin.command:
            cmd: >-
              docker exec {{ radarr_verify_control_container }}
              wget --quiet --output-document=- --header=X-Api-Key:{{ radarr_molecule_api_key }}
              http://127.0.0.1:7878/api/v3/system/status
          register: radarr_control_status
          changed_when: false
          failed_when: false

        - name: Read the ports the stock Radarr control container listens on
          ansible.builtin.command:
            cmd: "docker exec {{ radarr_verify_control_container }} netstat -lnt"
          register: radarr_control_listening
          changed_when: false

        - name: Assert the stock Radarr image has neither the role's key nor the role's port
          ansible.builtin.assert:
            that:
              - radarr_control_status.rc != 0
              - "'7878' in radarr_control_ports"
              - radarr_container_http_port | string not in radarr_control_ports
            fail_msg: >-
              The stock Radarr image accepted the role's API key or listens on
              17878 ({{ radarr_control_ports | join(', ') }}),
              so neither is evidence that the role configured anything
            success_msg: >-
              The stock Radarr image rejects the role's API key and listens on its built-in 7878,
              so both are the role's doing
          vars:
            radarr_control_ports: "{{ radarr_control_listening.stdout | regex_findall(':([0-9]+)\\s') | unique }}"

        - name: Ensure the Radarr negative control container is removed
          ansible.builtin.command:
            cmd: "docker rm -f {{ radarr_verify_control_container }}"
          changed_when: true

        - name: Verify nothing was quietly restarting while all of that was being checked
          when: "radarr_restarts_check_enabled | bool"
          block:
            # `Restart=always` means the unit reads `active` while it is crash-looping,
            # so `active` on its own says very little. The window has to be watched with
            # everything already answering.
            - name: Sample the restart counters
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: radarr_restarts_before
              loop: "{{ radarr_verify_units }}"

            # Comfortably longer than the unit's `RestartSec=30`, so a crash loop has to
            # tick at least once inside the window.
            - name: Watch the services for 45 seconds
              ansible.builtin.pause:
                seconds: 45

            - name: Sample the restart counters again
              ansible.builtin.systemd_service:
                name: "{{ item }}"
              register: radarr_restarts_after
              loop: "{{ radarr_verify_units }}"

            - name: Assert no service restarted while it was up
              ansible.builtin.assert:
                that:
                  - radarr_restarts_after.results | map(attribute='status.NRestarts') | list == radarr_restarts_before.results | map(attribute='status.NRestarts') | list
                  - radarr_restarts_after.results | map(attribute='status.ActiveState') | unique | list == ['active']
                fail_msg: >-
                  A service restarted while it was supposedly up, so `active` was hiding a crash loop.
                  Before:
                  {% for unit, restarts in radarr_verify_units | zip(radarr_restarts_before.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %},
                  after:
                  {% for unit, restarts in radarr_verify_units | zip(radarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}
                success_msg: >-
                  None of the services restarted over 45 seconds of watching (restarts so far:
                  {% for unit, restarts in radarr_verify_units | zip(radarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %})

        - name: Show the Radarr verification summary
          ansible.builtin.debug:
            msg:
              - "Radarr systemd: {% for unit, state in radarr_verify_units | zip(radarr_services.results | map(attribute='status.ActiveState')) %}{{ unit }} ({{ state }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Radarr restarts: {% for unit, restarts in radarr_verify_units | zip(radarr_restarts_after.results | map(attribute='status.NRestarts')) %}{{ restarts }} ({{ unit }}){% if not loop.last %}, {% endif %}{% endfor %}"
              - "Radarr version: {{ radarr_status.json.version }}"
              - "Radarr listening on: {{ radarr_listening_ports | join(', ') }} (configured: {{ radarr_container_http_port }})"
              - "Radarr instance name: {{ radarr_status.json.instanceName }}"
              - "Radarr database: {{ radarr_status.json.databaseType }} at migration {{ radarr_status.json.migrationVersion }}, under {{ radarr_verify_data_path }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Radarr systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=radarr.service
          register: radarr_service_log
          changed_when: false

        - name: Show the Radarr systemd service log
          ansible.builtin.debug:
            var: radarr_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Radarr verification failed. The systemd service log is printed above."
